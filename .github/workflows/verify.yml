name: Verify lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  agent-and-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run agent tests
        run: |
          docker build --target test -t protecting-ai-agents-test -f Dockerfile.agent .
          docker run --rm protecting-ai-agents-test
      - name: Build and smoke test guide image
        run: |
          docker build --target runtime -t protecting-ai-agents-guide -f Dockerfile.agent .
          docker run --rm -d --network host --name protecting-ai-agents-guide-smoke protecting-ai-agents-guide
          trap 'docker stop protecting-ai-agents-guide-smoke' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health
          curl -fsS http://127.0.0.1:8765/ | grep -q 'Protecting AI agents'

  private-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run private API tests
        run: |
          python -m pip install -r demo/private-api/requirements.txt
          PYTHONPATH=demo/private-api python -m pytest -q demo/private-api/tests

  controlled-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and test Worker
        run: |
          npm --prefix demo/mock-saas ci
          npm --prefix demo/mock-saas run check

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'
      - name: Validate Cloudflare configuration without deploying
        run: |
          terraform fmt -check infra/cloudflare/*.tf
          mkdir -p infra/pki/.secrets
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=CI fixture' \
            -keyout infra/pki/.secrets/root-ca.key \
            -out infra/pki/.secrets/root-ca.crt >/dev/null 2>&1
          terraform -chdir=infra/cloudflare init -backend=false -input=false
          terraform -chdir=infra/cloudflare validate
